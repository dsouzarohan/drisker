[package]
name = "drisker"
version = "0.1.0"
edition = "2024"
description = "A Windows-first system inspection and maintenance CLI"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3.27.0"
